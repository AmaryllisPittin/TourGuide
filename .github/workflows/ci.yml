name: TourGuide CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
         run:
            working-directory: ./TourGuide

        steps:
            - name: Recuperer le projet
              uses: actions/checkout@v4

            - name: Installer Java 17
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '17'
                cache: maven
                cache-dependency-path: TourGuide/pom.xml

            - name: Verifier les fichiers JAR
              run: | 
               echo "Repertoire courant: "
               pwd
               echo "Fichiers Jar disponibles: "
               find . -type f -name "*.jar"

            
            - name: Installer gpsUtil
              run: mvn install:install-file -Dfile=libs/gpsUtil.jar -DgroupId=gpsUtil -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar

            - name: Installer TripPricer
              run: mvn install:install-file -Dfile=libs/TripPricer.jar -DgroupId=tripPricer -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar

            - name: Installer RewardCentral
              run: mvn install:install-file -Dfile=libs/RewardCentral.jar -DgroupId=rewardCentral -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar

            - name: Compiler et tester
              run: mvn clean verify