name: TourGuide CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
         run:
            working-directory: ./TourGuide/TourGuide

        steps:
            - name: Recuperer le projet
              uses: actions/checkout@v4

            - name: Installer Java 17
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '17'
                cache: maven
                cache-dependency-path: TourGuide/TourGuide/pom.xml

            - name: Compiler et tester
              run: mvn clean verify